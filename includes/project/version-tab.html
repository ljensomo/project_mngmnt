<div id="versions-tab" style="display: none;">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <div>
            <h5 class="card-title mb-0 text-dark fw-bold">Project Versions</h5>
            <div class="d-flex align-items-center gap-2">
                <p class="text-muted small mb-0">Track history, releases, and development milestones.</p>
                <button type="button" class="btn p-0 text-muted border-0 bg-transparent lh-1" 
                        data-bs-toggle="modal" data-bs-target="#status-legend-modal" 
                        title="View Status Legend">
                    <i class="fa-solid fa-circle-question text-primary opacity-75 small-hover"></i>
                </button>
            </div>
        </div>
        <button type="button" class="btn btn-sm btn-primary rounded-pill px-3" data-bs-toggle="modal" data-bs-target="#version-modal">
            <i class="fas fa-plus me-1"></i> New Version
        </button>
    </div>

    <div class="table-responsive border rounded-3 bg-white shadow-xs">
        <table id="version-table" class="table table-hover align-middle mb-0" style="width: 100%;">
            <thead class="table-light text-uppercase tracking-wider">
                <tr>
                    <th class="text-secondary fw-bold py-3 ps-3" style="font-size: 0.75rem; width: 60px;">ID</th>
                    <th class="text-secondary fw-bold py-3" style="font-size: 0.75rem;">Version</th>
                    <th class="text-secondary fw-bold py-3" style="font-size: 0.75rem; width: 30%;">Remarks</th>
                    <th class="text-secondary fw-bold py-3" style="font-size: 0.75rem;">Status</th>
                    <th class="text-secondary fw-bold py-3" style="font-size: 0.75rem;">Target Date</th>
                    <th class="text-secondary fw-bold py-3" style="font-size: 0.75rem;">Released</th>
                    <th class="text-secondary fw-bold py-3" style="font-size: 0.75rem;">Created</th>
                    <th class="text-secondary fw-bold py-3 text-end pe-3" style="font-size: 0.75rem; width: 120px;">Actions</th>
                </tr>
            </thead>
            </table>
    </div>
</div>
