<!-- Modal -->
<div class="modal fade" id="task-modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
            <div class="modal-header border-bottom-0 pb-0 mt-2">
                <div class="d-flex align-items-center">
                    <div class="bg-success bg-opacity-10 text-success p-2 rounded-3 me-3">
                        <i class="fas fa-plus-circle"></i>
                    </div>
                    <h5 class="modal-title fw-bold" id="staticBackdropLabel">Create New Task</h5>
                </div>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form action="" id="task-form">
                <input type="hidden" name="project-id" id="a-task-project-id">
                
                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Task Title</label>
                            <input class="form-control bg-light border-0 py-2 shadow-none" type="text" name="task" placeholder="What needs to be done?" required style="border-radius: 8px;">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Category/Type</label>
                            <select name="type" class="form-select bg-light border-0 py-2 shadow-none" id="task-type-1" required style="border-radius: 8px;">
                                <option value="" disabled selected>-- Choose Type</option>
                                </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Assign To</label>
                            <select name="assign-to" id="a-task-assign-to" class="form-select bg-light border-0 py-2 shadow-none" style="border-radius: 8px;">
                                <option value="" disabled selected>-- Choose Assignee</option>
                                </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Description</label>
                            <textarea class="form-control bg-light border-0 py-2 shadow-none" name="description" placeholder="Add some details about this task..." rows="3" required style="border-radius: 8px; resize: none;"></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-top-0 pt-0 pb-4 pe-4">
                    <button type="button" class="btn btn-link text-decoration-none text-muted fw-semibold" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-success px-4 fw-bold shadow-sm" style="border-radius: 8px;">
                        <i class="fas fa-plus me-2"></i>Create Task
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Modal -->
<div class="modal fade" id="task-edit-modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
            <div class="modal-header border-bottom-0 pb-0 mt-2">
                <div class="d-flex align-items-center">
                    <div class="bg-primary bg-opacity-10 text-primary p-2 rounded-3 me-3">
                        <i class="fas fa-edit"></i>
                    </div>
                    <h5 class="modal-title fw-bold" id="staticBackdropLabel">Edit Task Details</h5>
                </div>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form action="" id="task-edit-form">
                <input type="hidden" name="project_id" id="e-task-project-id">
                <input type="hidden" name="task_id" id="task-id">
                
                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Task Name</label>
                            <input class="form-control bg-light border-0 py-2 shadow-none" type="text" name="task" placeholder="e.g. Database Migration" id="task" required style="border-radius: 8px;">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Type</label>
                            <select name="type" class="form-select bg-light border-0 py-2 shadow-none" id="task-type-2" required style="border-radius: 8px;">
                                <option value="" disabled selected>-- Select Type</option>
                                </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Status</label>
                            <select name="status" id="status" class="form-select bg-light border-0 py-2 shadow-none" required style="border-radius: 8px;">
                                <option value="" disabled selected>-- Choose Status</option>
                                </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Assignee</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 text-muted" style="border-radius: 8px 0 0 8px;">
                                    <i class="fas fa-user-circle"></i>
                                </span>
                                <select name="assignee" id="e-task-assign-to" class="form-select bg-light border-0 py-2 shadow-none" style="border-radius: 0 8px 8px 0;">
                                    <option value="" disabled selected>-- Choose Assignee</option>
                                </select>
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Description</label>
                            <textarea class="form-control bg-light border-0 py-2 shadow-none" name="description" placeholder="Briefly describe the objective..." id="description" rows="4" required style="border-radius: 8px;"></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-top-0 pt-0 pb-4 pe-4">
                    <button type="button" class="btn btn-link text-decoration-none text-muted fw-semibold" data-bs-dismiss="modal">Discard</button>
                    <button type="submit" class="btn btn-primary px-4 fw-bold shadow-sm" style="border-radius: 8px;">
                        <i class="fas fa-check-circle me-2"></i>Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
