<!-- Add Modal -->
<div class="modal fade" id="feature-modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
            <div class="modal-header border-bottom-0 pb-0 mt-2">
                <div class="d-flex align-items-center">
                    <div class="bg-primary bg-opacity-10 text-primary p-2 rounded-3 me-3">
                        <i class="fas fa-star"></i>
                    </div>
                    <h5 class="modal-title fw-bold" id="staticBackdropLabel">Add New Feature</h5>
                </div>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form action="" id="feature-form">
                <input type="hidden" name="project-id" id="a-feature-project-id">
                
                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Parent Module</label>
                            <select name="module" id="module-options" class="form-select bg-light border-0 py-2 shadow-none" required style="border-radius: 8px;">
                                <option value="" disabled selected>-- Select Module</option>
                            </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Version</label>
                            <select name="version_id" id="feature-version" class="form-select bg-light border-0 py-2 shadow-none" style="border-radius: 8px;">
                                <option value="" selected>-- Select Version</option>
                            </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Feature Title</label>
                            <input class="form-control bg-light border-0 py-2 shadow-none" type="text" name="feature" placeholder="e.g. Export to PDF" aria-label="Feature" required style="border-radius: 8px;">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Description</label>
                            <textarea class="form-control bg-light border-0 py-2 shadow-none" name="description" placeholder="Describe what this feature allows the user to do..." rows="4" required style="border-radius: 8px;"></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-top-0 pt-0 pb-4 pe-4">
                    <button type="button" class="btn btn-link text-decoration-none text-muted fw-semibold" data-bs-dismiss="modal">Discard</button>
                    <button type="submit" class="btn btn-success px-4 fw-bold shadow-sm" style="border-radius: 8px;">
                        <i class="fas fa-plus me-2"></i>Add Feature
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>


<!-- Edit Modal -->
<div class="modal fade" id="feature-edit-modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
            <div class="modal-header border-bottom-0 pb-0 mt-2">
                <div class="d-flex align-items-center">
                    <div class="bg-primary bg-opacity-10 text-primary p-2 rounded-3 me-3">
                        <i class="fas fa-pen-nib"></i>
                    </div>
                    <h5 class="modal-title fw-bold" id="staticBackdropLabel">Edit Feature Details</h5>
                </div>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form action="" id="feature-edit-form">
                <input type="hidden" name="project_id" id="e-feature-project-id">
                <input type="hidden" name="feature_id" id="feature-id">

                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Feature Title</label>
                            <input class="form-control bg-light border-0 py-2 shadow-none" type="text" name="feature" placeholder="Feature Name" id="feature" required style="border-radius: 8px;">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Current Status</label>
                            <select name="status" id="feature-status" class="form-select bg-light border-0 py-2 shadow-none" required style="border-radius: 8px;">
                                <option value="" disabled selected>-- Choose Status</option>
                                </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Assigned Version</label>
                            <select name="version_id" id="feature-edit-version" class="form-select bg-light border-0 py-2 shadow-none" style="border-radius: 8px;">
                                <option value="">-- Select Version</option>
                                </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Description</label>
                            <textarea class="form-control bg-light border-0 py-2 shadow-none" name="description" placeholder="Describe the feature details..." id="feature-description" rows="4" required style="border-radius: 8px;"></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-top-0 pt-0 pb-4 pe-4">
                    <button type="button" class="btn btn-link text-decoration-none text-muted fw-semibold" data-bs-dismiss="modal">Discard</button>
                    <button type="submit" class="btn btn-primary px-4 fw-bold shadow-sm" style="border-radius: 8px;">
                        <i class="fas fa-save me-2"></i>Update Feature
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
