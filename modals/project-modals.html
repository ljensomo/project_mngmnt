<!-- Create - Modal -->
<div class="modal fade" id="project-modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="projectModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
            <div class="modal-header border-bottom-0 pb-0 mt-2">
                <div class="d-flex align-items-center">
                    <div class="bg-primary bg-opacity-10 text-primary p-2 rounded-3 me-3">
                        <i class="fas fa-folder-plus"></i>
                    </div>
                    <h5 class="modal-title fw-bold" id="projectModalLabel">Create New Project</h5>
                </div>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form action="" id="project-form">
                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Project Name</label>
                            <input class="form-control bg-light border-0 py-2 shadow-none" type="text" name="name" placeholder="Enter project name" required style="border-radius: 8px;">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Description</label>
                            <textarea class="form-control bg-light border-0 py-2 shadow-none" name="description" placeholder="Add some details about this project..." rows="3" required style="border-radius: 8px; resize: none;"></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-top-0 pt-0 pb-4 pe-4">
                    <button type="button" class="btn btn-link text-decoration-none text-muted fw-semibold" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-primary px-4 fw-bold shadow-sm" style="border-radius: 8px;">
                        <i class="fas fa-plus me-2"></i>Create Project
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Update - Modal -->
<div class="modal fade" id="project-edit-modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="projectEditModalLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
            <div class="modal-header border-bottom-0 pb-0 mt-2">
                <div class="d-flex align-items-center">
                    <div class="bg-warning bg-opacity-10 text-warning p-2 rounded-3 me-3">
                        <i class="fas fa-pen-to-square"></i>
                    </div>
                    <h5 class="modal-title fw-bold" id="projectEditModalLabel">Update Project Details</h5>
                </div>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form action="" id="project-edit-form">
                <input type="hidden" name="id" id="project-id">
                
                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Project Name</label>
                            <input class="form-control bg-light border-0 py-2 shadow-none" type="text" name="name" id="project-name" required style="border-radius: 8px;">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Description</label>
                            <textarea class="form-control bg-light border-0 py-2 shadow-none" name="description" id="description" rows="3" required style="border-radius: 8px; resize: none;"></textarea>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Phase</label>
                            <select name="phase" id="phase" class="form-select bg-light border-0 py-2 shadow-none" required style="border-radius: 8px;">
                                <option value="" disabled>-- Choose Phase</option>
                                <option value="1">Planning</option>
                                <option value="2">Design</option>
                                <option value="3">Development</option>
                                <option value="4">Testing</option>
                                <option value="5">Deployment</option>
                                <option value="6">Maintenance</option>
                                <option value="7">Closed</option>
                            </select>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-top-0 pt-0 pb-4 pe-4">
                    <button type="button" class="btn btn-link text-decoration-none text-muted fw-semibold" data-bs-dismiss="modal">Cancel</button>
                    <button type="submit" class="btn btn-warning px-4 fw-bold shadow-sm" style="border-radius: 8px;">
                        <i class="fas fa-save me-2"></i>Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
