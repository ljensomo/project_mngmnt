<!-- Add Modal -->
<div class="modal fade" id="module-modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-1 shadow-lg" style="border-radius: 16px;">
            <div class="modal-header border-bottom-0 pb-0 mt-2">
                <div class="d-flex align-items-center">
                    <div class="bg-primary bg-opacity-10 text-primary p-2 rounded-3 me-3">
                        <i class="fas fa-layer-group"></i>
                    </div>
                    <h5 class="modal-title fw-bold" id="staticBackdropLabel">Add New Module</h5>
                </div>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <form action="" id="module-form">
                <input type="hidden" name="project-id" id="a-module-project-id">
                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Module Name</label>
                            <input class="form-control bg-light border-0 py-2 shadow-none" type="text" name="module" placeholder="e.g. User Authentication" id="module-name" required style="border-radius: 8px;">
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Target Version</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-0 text-muted" style="border-radius: 8px 0 0 8px;">
                                    <i class="fas fa-tag"></i>
                                </span>
                                <select name="version_id" id="module-version" class="form-select bg-light border-0 py-2 shadow-none" required style="border-radius: 0 8px 8px 0;">
                                    <option value="" disabled selected>-- Select Version</option>
                                    </select>
                            </div>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Description</label>
                            <textarea class="form-control bg-light border-0 py-2 shadow-none" name="description" placeholder="Briefly explain the module's scope..." rows="4" required style="border-radius: 8px;"></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-top-0 pt-0 pb-4 pe-4">
                    <button type="button" class="btn fw-semibold rounded-pill px-3 btn-outline-secondary" data-bs-dismiss="modal">Discard</button>
                    <button type="submit" class="btn btn-success px-4 fw-bold shadow-sm rounded-pill px-3">
                        <i class="fas fa-plus me-2"></i>Create Module
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>

<!-- Edit Modal -->
<div class="modal fade" id="module-edit-modal" data-bs-backdrop="static" data-bs-keyboard="false" tabindex="-1" aria-labelledby="staticBackdropLabel" aria-hidden="true">
    <div class="modal-dialog">
        <div class="modal-content border-0 shadow-lg" style="border-radius: 16px;">
            <div class="modal-header border-bottom-0 pb-0 mt-2">
                <div class="d-flex align-items-center">
                    <div class="bg-primary bg-opacity-10 text-primary p-2 rounded-3 me-3">
                        <i class="fas fa-edit"></i>
                    </div>
                    <h5 class="modal-title fw-bold" id="staticBackdropLabel">Edit Module Details</h5>
                </div>
                <button type="button" class="btn-close shadow-none" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <form action="" id="module-edit-form">
                <input type="hidden" name="project_id" id="e-module-project-id">
                <input type="hidden" name="module_id" id="module-id">

                <div class="modal-body p-4">
                    <div class="row g-3">
                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Module Name</label>
                            <input class="form-control bg-light border-0 py-2 shadow-none" type="text" name="module" placeholder="Module Name" id="module" required style="border-radius: 8px;">
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Status</label>
                            <select name="status" id="module-status" class="form-select bg-light border-0 py-2 shadow-none" required style="border-radius: 8px;">
                                <option value="" disabled selected>-- Choose Status</option>
                                </select>
                        </div>

                        <div class="col-md-6">
                            <label class="form-label small fw-bold text-muted text-uppercase">Version</label>
                            <select name="version_id" id="module-edit-version" class="form-select bg-light border-0 py-2 shadow-none" required style="border-radius: 8px;">
                                <option value="" selected>-- Select Version</option>
                                </select>
                        </div>

                        <div class="col-12">
                            <label class="form-label small fw-bold text-muted text-uppercase">Description</label>
                            <textarea class="form-control bg-light border-0 py-2 shadow-none" name="description" placeholder="Description" id="module-description" rows="4" required style="border-radius: 8px;"></textarea>
                        </div>
                    </div>
                </div>

                <div class="modal-footer border-top-0 pt-0 pb-4 pe-4">
                    <button type="button" class="btn btn-link text-decoration-none text-muted fw-semibold" data-bs-dismiss="modal">Discard</button>
                    <button type="submit" class="btn btn-primary px-4 fw-bold shadow-sm" style="border-radius: 8px;">
                        <i class="fas fa-save me-2"></i>Save Changes
                    </button>
                </div>
            </form>
        </div>
    </div>
</div>
